<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body {
            background: #121212;
            min-height: 100vh;
            color: #F8FAFC;
            padding-top: 52px;
        }

        .tombol-kembali {
            position:fixed; top:12px; left:12px; width:36px; height:36px;
            border-radius:50%; background:#B8860B; border:none; color:#fff;
            font-size:16px; cursor:pointer; z-index:30;
        }

        /* === BARIS ATAS === */
        .baris-atas {
            position:fixed; top:0; left:0; right:0;
            background: #121212; padding:10px 16px;
            display:flex; align-items:center; gap:10px; z-index:20;
            border-bottom: 1px solid #1F2937;
        }
        .ikon-menu {font-size:20px; color:#fff;}
        .pencarian {
            flex:1; background:#1F2937; border:none; border-radius:20px;
            padding:8px 16px; color:#fff; font-size:15px; outline:none;
        }
        .pencarian:focus {box-shadow:0 0 0 2px #60A5FA;}

        /* === TAB — HANYA DRIVE SAYA === */
        .tab-container {
            display:flex; padding:8px 16px; border-bottom:1px solid #1F2937;
        }
        .tab {flex:1; text-align:center; padding:8px; font-size:15px; color:#60A5FA; font-weight:600; border-bottom:2px solid #60A5FA;}

        /* === HEADER NAMA — TANPA IKON SEBELAHNYA === */
        .header-nama {
            font-size:15px; color:#94A3B8; padding:10px 16px;
            border-bottom:1px solid #1F2937;
        }

        /* === DAFTAR FILE === */
        .daftar-file {padding:0 16px;}
        .item-file {
            display:flex; align-items:center; gap:14px; padding:12px 0;
            border-bottom:1px solid #1F2937; cursor:pointer; transition:background 0.15s;
        }
        .item-file:active {background:#1F2937;}
        .ikon-laporan {width:48px; height:48px; flex-shrink:0;}
        .ikon-laporan img {width:100%; height:100%; object-fit:contain;}
        .info-nama {flex:1;}
        .nama-file {font-size:15px; color:#F8FAFC; margin-bottom:2px;}
        .info-waktu {font-size:12px; color:#6B7280;}

        .loading, .kosong {
            color:#94A3B8; font-size:14px; padding:30px 0;
        }
        .sembunyi {display:none !important;}
    </style>
</head>
<body>

    <button class="tombol-kembali" onclick="window.location.href='dasbor.html'">←</button>

    <!-- ✅ HAPUS: bintang, mahkota, ikon sebelah Nama, tab Komputer -->
    <div class="baris-atas">
        <span class="ikon-menu">☰</span>
        <input type="text" class="pencarian" id="cari" placeholder="Telusuri di Drive" oninput="filterNama()">
    </div>

    <div class="tab-container">
        <div class="tab">Drive Saya</div>
    </div>

    <div class="header-nama">
        Nama
    </div>

    <div class="daftar-file" id="daftarFile">
        <div class="loading">Memverifikasi...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let urlLaporan = "";
        let urlLaporan2 = "";
        let semuaItem = [];

        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            try {
                semuaItem = [];
                const daftarEl = document.getElementById("daftarFile");
                daftarEl.innerHTML = "";

                // Laporan 1
                const doc = await db.doc("onwer/laporan").get();
                if (doc.exists && doc.data().url) {
                    urlLaporan = doc.data().url;
                    semuaItem.push({
                        nama: doc.data().nama || "Laporan",
                        waktu: doc.data().diubah || "4 Sep",
                        ikon: "loginwall/laporan.png",
                        fungsi: "bukaLaporan()"
                    });
                }

                // Laporan 2
                const doc2 = await db.doc("onwer/laporan2").get();
                if (doc2.exists && doc2.data().url) {
                    urlLaporan2 = doc2.data().url;
                    semuaItem.push({
                        nama: doc2.data().nama || "Laporan 2",
                        waktu: doc2.data().diubah || "4 Sep",
                        ikon: "loginwall/laporan2.png",
                        fungsi: "bukaLaporan2()"
                    });
                }

                tampilkanSemua();

                if (semuaItem.length === 0) {
                    daftarEl.innerHTML = `<div class="kosong">Data tidak ditemukan</div>`;
                }

            } catch (e) {
                document.getElementById("daftarFile").innerHTML = 
                    `<div class="kosong">Gagal memuat</div>`;
            }
        });

        function tampilkanSemua(kataKunci = "") {
            const daftarEl = document.getElementById("daftarFile");
            daftarEl.innerHTML = "";
            
            const hasil = semuaItem.filter(item => 
                item.nama.toLowerCase().includes(kataKunci.toLowerCase())
            );

            if (hasil.length === 0 && kataKunci) {
                daftarEl.innerHTML = `<div class="kosong">Tidak ditemukan</div>`;
                return;
            }

            hasil.forEach(item => {
                daftarEl.innerHTML += `
                    <div class="item-file" onclick="${item.fungsi}" data-nama="${item.nama.toLowerCase()}">
                        <div class="ikon-laporan">
                            <img src="${item.ikon}" alt="">
                        </div>
                        <div class="info-nama">
                            <div class="nama-file">${item.nama}</div>
                            <div class="info-waktu">Diubah ${item.waktu}</div>
                        </div>
                    </div>`;
            });
        }

        function filterNama() {
            const kata = document.getElementById("cari").value;
            tampilkanSemua(kata);
        }

        function bukaLaporan() {
            if (urlLaporan) window.open(urlLaporan, "_blank");
        }

        function bukaLaporan2() {
            if (urlLaporan2) window.open(urlLaporan2, "_blank");
        }
    </script>
</body>
</html>
