<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Akun — CLOVERA UNION</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0F1729, #1A2744);
            min-height: 100vh;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .kartu {
            background: #1E293B;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
            overflow: hidden;
            border: none;
        }

        .header {
            background: transparent;
            padding: 20px 20px 10px 20px;
            text-align: left;
            color: #fff;
            border: none;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
        }

        .isi {
            padding: 20px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .isi::-webkit-scrollbar {width:4px;}
        .isi::-webkit-scrollbar-thumb {background:#4B5563; border-radius:4px;}

        h2 {
            font-size: 15px;
            color: #FFFFFF;
            margin-bottom: 16px;
            padding-bottom: 6px;
            border: none;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #E5E5E5;
            margin-bottom: 5px;
        }

        label span {color: #FF6B6B;}

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 12px;
            background: #334155;
            color: #FFFFFF;
            transition: 0.2s;
        }

        textarea {
            resize: none;
            min-height: 80px;
        }

        input::placeholder, textarea::placeholder {color: #94A3B8;}

        input:focus, textarea:focus {
            outline: none;
            background: #3F4E67;
            box-shadow: 0 0 0 3px rgba(255,215,0,0.15);
        }

        .tombol {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .tombol-emas {
            background: linear-gradient(180deg, #FFD700, #DAA520);
            color: #3F2A00;
            margin-top: 8px;
        }

        .tombol-emas:hover {transform: translateY(-1px);}
        .tombol-emas:disabled {opacity: 0.6; cursor: not-allowed; transform: none;}

        /* === STATUS VERIFIKASI === */
        .status-verifikasi {
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.6;
            display: none;
        }
        .status-pending {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #FFD700;
            display: block;
        }
        .status-disetujui {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ADE80;
            display: block;
        }
        .status-ditolak {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #F87171;
            display: block;
        }

        .pesan {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            display: none;
            line-height: 1.6;
            border: none;
        }

        .sukses {background: #1E3D2F; color: #A7F3D0; display: block;}
        .error {background: #3D1E1E; color: #FCA5A5; display: block;}
        .info {background: #1E2F3D; color: #A7D6F3; display: block;}
        .peringatan {background: #3F361C; color: #FDE047; display: block;}

        .link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #94A3B8;
        }

        .link a {
            color: #FFD700;
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="kartu">

            <div class="header">
                <h1>VERIFIKASI AKUN</h1>
            </div>

            <div class="isi">
                <!-- === STATUS VERIFIKASI === -->
                <div id="statusVerifikasi" class="status-verifikasi">
                    <strong id="teksStatus">Menunggu...</strong><br>
                    <span id="keteranganStatus">Memeriksa status...</span>
                </div>

                <h2 id="formJudul">Data Verifikasi</h2>

                <div id="formVerifikasi">
                    <label>Nama Lengkap Sesuai KTP <span>*</span></label>
                    <input type="text" id="namaKtp" placeholder="Nama lengkap sesuai KTP">

                    <label>NIK (16 Digit) <span>*</span></label>
                    <input type="text" id="nik" placeholder="Nomor Induk Kependudukan" maxlength="16">

                    <label>Alamat Sesuai KTP <span>*</span></label>
                    <textarea id="alamatKtp" placeholder="Alamat lengkap sesuai KTP"></textarea>

                    <label>Nama Bank <span>*</span></label>
                    <input type="text" id="namaBank" placeholder="Contoh: BRI, BCA, Mandiri">

                    <label>Nomor Rekening <span>*</span></label>
                    <input type="text" id="noRekening" placeholder="Nomor rekening">

                    <label>Atas Nama Rekening <span>*</span></label>
                    <input type="text" id="atasNama" placeholder="Nama pemilik rekening">

                    <button class="tombol tombol-emas" id="btnKirim" onclick="kirimVerifikasi()">
                        KIRIM VERIFIKASI
                    </button>
                </div>

                <div class="pesan" id="kotakPesan"></div>

                <div class="link">
                    <a href="dasbor.html">Kembali ke Beranda</a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let uidPengguna = null;

        function tampilPesan(teks, jenis = "error") {
            const pesan = document.getElementById("kotakPesan");
            pesan.style.display = "block";
            pesan.className = `pesan ${jenis}`;
            pesan.textContent = teks;
        }

        function tampilkanStatus(status, keterangan = "") {
            const blok = document.getElementById("statusVerifikasi");
            const teks = document.getElementById("teksStatus");
            const ket = document.getElementById("keteranganStatus");
            
            blok.className = "status-verifikasi";
            
            if (status === "menunggu" || status === "PENDING") {
                blok.classList.add("status-pending");
                teks.textContent = "⏳ MENUNGGU VERIFIKASI";
                ket.textContent = keterangan || "Permintaan Anda sedang ditinjau oleh admin.";
            } else if (status === "disetujui") {
                blok.classList.add("status-disetujui");
                teks.textContent = " DISETUJUI";
                ket.textContent = keterangan || "Verifikasi akun standar";
            } else if (status === "ditolak") {
                blok.classList.add("status-ditolak");
                teks.textContent = "❌ DITOLAK";
                ket.textContent = keterangan || "Verifikasi ditolak. Silakan perbaiki data dan kirim ulang.";
            }
        }

        function sembunyikanForm() {
            document.getElementById("formVerifikasi").style.display = "none";
            document.getElementById("formJudul").style.display = "none";
        }

        function tampilkanForm() {
            document.getElementById("formVerifikasi").style.display = "block";
            document.getElementById("formJudul").style.display = "block";
        }

        async function cekStatusVerifikasi() {
            if (!uidPengguna) return;
            
            try {
                const docRef = db.collection("verifikasi").doc(uidPengguna);
                const docSnap = await docRef.get();
                
                if (!docSnap.exists) {
                    // Belum pernah kirim
                    document.getElementById("statusVerifikasi").style.display = "none";
                    tampilkanForm();
                    return;
                }
                
                const data = docSnap.data();
                const status = data.statusVerifikasi || "menunggu";
                
                document.getElementById("statusVerifikasi").style.display = "block";
                
                if (status === "disetujui") {
                    tampilkanStatus("disetujui");
                    sembunyikanForm();
                } else if (status === "ditolak") {
                    tampilkanStatus("ditolak");
                    // Isi data lama agar bisa diedit & dikirim ulang
                    document.getElementById("namaKtp").value = data.namaKtp || "";
                    document.getElementById("nik").value = data.nik || "";
                    document.getElementById("alamatKtp").value = data.alamatKtp || "";
                    document.getElementById("namaBank").value = data.namaBank || "";
                    document.getElementById("noRekening").value = data.noRekening || "";
                    document.getElementById("atasNama").value = data.atasNama || "";
                    tampilkanForm();
                } else {
                    // Menunggu / PENDING
                    tampilkanStatus("menunggu");
                    sembunyikanForm();
                }
                
            } catch (err) {
                console.log("Cek status error:", err);
            }
        }

        async function kirimVerifikasi() {
            const user = auth.currentUser;
            if (!user) {
                tampilPesan("Silakan masuk terlebih dahulu!", "error");
                return;
            }

            const namaKtp = document.getElementById("namaKtp").value.trim();
            const nik = document.getElementById("nik").value.trim();
            const alamatKtp = document.getElementById("alamatKtp").value.trim();
            const namaBank = document.getElementById("namaBank").value.trim();
            const noRekening = document.getElementById("noRekening").value.trim();
            const atasNama = document.getElementById("atasNama").value.trim();
            const tombol = document.getElementById("btnKirim");

            document.getElementById("kotakPesan").style.display = "none";

            if (!namaKtp || !nik || !alamatKtp || !namaBank || !noRekening || !atasNama) {
                tampilPesan("Lengkapi semua data!", "peringatan");
                return;
            }
            if (nik.length !== 16 || isNaN(nik)) {
                tampilPesan("NIK harus 16 digit angka!", "error");
                return;
            }

            tombol.disabled = true;
            tombol.textContent = "Diproses...";

            try {
                const docRef = db.collection("verifikasi").doc(user.uid);
                const docSnap = await docRef.get();

                if (docSnap.exists && docSnap.data().statusVerifikasi === "menunggu") {
                    tampilPesan("Permintaan verifikasi sudah dikirim.\nSilakan tunggu persetujuan admin.", "info");
                    tombol.disabled = false;
                    tombol.textContent = "KIRIM VERIFIKASI";
                    return;
                }

                // Simpan atau Update (jika sebelumnya ditolak)
                await docRef.set({
                    uidPengguna: user.uid,
                    emailPengguna: user.email,
                    namaKtp: namaKtp,
                    nik: nik,
                    alamatKtp: alamatKtp,
                    namaBank: namaBank,
                    noRekening: noRekening,
                    atasNama: atasNama,
                    statusVerifikasi: "menunggu",
                    tanggalDikirim: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                tampilPesan("PERMINTAAN TERKIRIM!\n\nSilakan tunggu verifikasi admin.", "sukses");
                
                // Refresh status
                setTimeout(() => {
                    cekStatusVerifikasi();
                }, 1500);

            } catch (err) {
                console.log("Error:", err);
                tampilPesan("Terjadi kesalahan, coba lagi.", "error");
                tombol.disabled = false;
                tombol.textContent = "KIRIM VERIFIKASI";
            }
        }

        // Cek status saat halaman dimuat
        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "Login.html";
                return;
            }
            uidPengguna = user.uid;
            cekStatusVerifikasi();
        });
    </script>
</body>
</html>
