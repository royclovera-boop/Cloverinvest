<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERINGKAT — CLOVERA UNION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body {
            background: linear-gradient(180deg, #0F172A 0%, #1E293B 50%, #0F172A 100%);
            min-height:100vh;
            padding:12px; position:relative; color:#fff;
        }

        .tombol-kembali {
            position:fixed; top:12px; left:12px; z-index:100;
            width:42px; height:42px; border-radius:50%;
            background:linear-gradient(135deg, #1E3A5F, #2C5282);
            border:none; color:#fff; font-size:18px; font-weight:bold;
            cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.5);
            transition:transform 0.2s;
        }
        .tombol-kembali:active {transform:scale(0.92);}

        .container {max-width:420px; margin:60px auto 20px;}

        .header {
            text-align:center; margin-bottom:24px;
        }
        .header h1 {
            font-size:20px; font-weight:700; color:#FFFFFF;
            margin-bottom:4px;
        }
        .header p {font-size:13px; color:#94A3B8;}

        /* ===== PODIUM 1-2-3 ===== */
        .podium-wrapper {
            display:flex; align-items:flex-end; justify-content:center; gap:8px;
            margin-bottom:28px; padding:0 4px;
        }
        .podium-posisi {
            display:flex; flex-direction:column; align-items:center; flex:1;
        }
        .podium-avatar {
            width:56px; height:56px; border-radius:50%;
            display:flex; align-items:center; justify-content:center;
            font-size:22px; font-weight:bold; margin-bottom:6px;
            position:relative; border:3px solid transparent;
        }
        .podium-posisi-2 .podium-avatar {
            background:linear-gradient(135deg, #475569, #64748B);
            border-color:#94A3B8;
        }
        .podium-posisi-1 .podium-avatar {
            width:68px; height:68px; font-size:26px;
            background:linear-gradient(135deg, #FBBF24, #F59E0B);
            border-color:#FCD34D; box-shadow:0 0 12px rgba(251,191,36,0.4);
        }
        .podium-posisi-3 .podium-avatar {
            background:linear-gradient(135deg, #B45309, #D97706);
            border-color:#F59E0B;
        }
        .podium-nama {
            font-size:13px; font-weight:600; color:#fff; margin-bottom:2px;
            white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; text-align:center;
        }
        .podium-persen {
            font-size:12px; font-weight:600; margin-bottom:4px;
        }
        .persen-naik {color:#4ADE80;}
        .persen-turun {color:#F87171;}
        .persen-nol {color:#94A3B8;}
        .podium-nilai {
            font-size:11px; color:#CBD5E1;
        }
        .podium-papan {
            width:100%; display:flex; align-items:center; justify-content:center;
            font-weight:bold; font-size:18px; padding:10px 0; border-radius:8px 8px 4px 4px;
        }
        .podium-posisi-2 .podium-papan {
            background:linear-gradient(180deg, #64748B, #475569); height:60px;
        }
        .podium-posisi-1 .podium-papan {
            background:linear-gradient(180deg, #F59E0B, #D97706); height:80px; font-size:22px;
        }
        .podium-posisi-3 .podium-papan {
            background:linear-gradient(180deg, #B45309, #92400E); height:50px;
        }

        /* ===== DAFTAR PERINGKAT ===== */
        .daftar-wrapper {
            background:rgba(30,41,59,0.5); border-radius:14px;
            border:1px solid rgba(71,85,105,0.5); overflow:hidden;
        }
        .daftar-judul {
            padding:12px 16px; font-size:14px; font-weight:700;
            color:#E2E8F0; border-bottom:1px solid rgba(71,85,105,0.4);
            display:flex; justify-content:space-between;
        }
        .jumlah-user {font-size:12px; color:#94A3B8; font-weight:500;}

        .baris-pengguna {
            display:flex; align-items:center; gap:12px; padding:14px 16px;
            border-bottom:1px solid rgba(71,85,105,0.25);
            transition:background 0.2s;
        }
        .baris-pengguna:last-child {border-bottom:none;}
        .baris-pengguna:hover {background:rgba(51,65,85,0.4);}
        .baris-pengguna.saya {background:rgba(251,191,36,0.1); border-left:3px solid #FBBF24;}

        .nomor-urutan {
            width:32px; height:32px; border-radius:50%;
            background:#334155; color:#CBD5E1;
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:13px; flex-shrink:0;
        }
        .info-pengguna {flex:1; min-width:0;}
        .nama-ktp {
            font-size:14px; font-weight:600; color:#F1F5F9;
            margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .persentase-baris {font-size:12px;}

        .saldo-pengguna {text-align:right;}
        .nilai-saldo {
            font-size:14px; font-weight:700; color:#4ADE80;
            margin-bottom:2px;
        }
        .label-saldo {font-size:10px; color:#64748B; text-transform:uppercase;}

        .loading, .tidak-ada {
            text-align:center; padding:40px 20px; color:#94A3B8; font-size:14px;
        }
    </style>
</head>
<body>

    <button class="tombol-kembali" onclick="window.location.href='dasbor.html'">←</button>

    <div class="container">
        <div class="header">
            <h1> CLOVERA UNION</h1>
            <p>Investor</p>
        </div>

        <!-- PODIUM 1-2-3 -->
        <div class="podium-wrapper" id="podiumWrapper">
            <div class="loading" style="padding:20px;">Memuat...</div>
        </div>

        <!-- DAFTAR DI BAWAH -->
        <div class="daftar-wrapper">
            <div class="daftar-judul">
                <span>DAFTAR ANGGOTA</span>
                <span class="jumlah-user" id="jumlahUser">0 Peserta</span>
            </div>
            <div id="daftarPeringkat">
                <div class="loading">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let uidSaatIni = null;
        let daftarSemua = [];

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "Login.html";
                return;
            }
            uidSaatIni = user.uid;
            muatPeringkat();
        });

        // === RUMUS PERSENTASE ===
        // saldoPokok = modal awal
        // keuntungan = hasil untung/rugi (bisa minus)
        // Contoh: saldo $50, untung $25 → +50%
        // Contoh: saldo $50, rugi $10 → -20%
        function hitungPersentase(saldoPokok, keuntungan) {
            const modal = Number(saldoPokok) || 0;
            const untung = Number(keuntungan) || 0;
            
            if (modal <= 0) {
                if (untung > 0) return "+∞%";
                if (untung < 0) return "-∞%";
                return "0.00%";
            }
            
            const persen = (untung / modal) * 100;
            return `${persen >= 0 ? '+' : ''}${persen.toFixed(2)}%`;
        }

        // === WARNA BERDASARKAN HASIL ===
        function kelasWarna(saldoPokok, keuntungan) {
            const modal = Number(saldoPokok) || 0;
            const untung = Number(keuntungan) || 0;
            if (modal <= 0 && untung === 0) return "persen-nol";
            if (untung === 0) return "persen-nol";
            return untung > 0 ? "persen-naik" : "persen-turun";
        }

        async function muatPeringkat() {
            const wadahDaftar = document.getElementById("daftarPeringkat");
            const wadahPodium = document.getElementById("podiumWrapper");
            const jumlahEl = document.getElementById("jumlahUser");

            try {
                const snap = await db.collection("pengguna").limit(200).get();

                if (snap.empty) {
                    wadahPodium.innerHTML = `<div class="tidak-ada">Belum ada data.</div>`;
                    wadahDaftar.innerHTML = "";
                    jumlahEl.textContent = "0 Peserta";
                    return;
                }

                daftarSemua = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    const saldoPokok = Number(d.saldo) || 0;
                    const keuntungan = Number(d.keuntungan) || 0;
                    const totalSaldo = saldoPokok + keuntungan;
                    
                    daftarSemua.push({
                        uid: doc.id,
                        atasNama: d.atasNama || "Tidak ada nama",
                        saldoPokok: saldoPokok,
                        keuntungan: keuntungan,
                        totalSaldo: totalSaldo
                    });
                });

                daftarSemua.sort((a, b) => b.totalSaldo - a.totalSaldo);
                jumlahEl.textContent = `${daftarSemua.length} Peserta`;

                // === PODIUM 1-2-3 ===
                let podiumHtml = "";
                if (daftarSemua.length >= 2) {
                    const p2 = daftarSemua[1];
                    podiumHtml += `
                    <div class="podium-posisi podium-posisi-2">
                        <div class="podium-avatar">${(p2.atasNama.charAt(0)).toUpperCase()}</div>
                        <div class="podium-nama">${p2.atasNama}</div>
                        <div class="podium-persen ${kelasWarna(p2.saldoPokok, p2.keuntungan)}">${hitungPersentase(p2.saldoPokok, p2.keuntungan)}</div>
                        <div class="podium-nilai">$ ${p2.totalSaldo.toFixed(2)}</div>
                        <div class="podium-papan">2</div>
                    </div>`;
                }
                if (daftarSemua.length >= 1) {
                    const p1 = daftarSemua[0];
                    podiumHtml += `
                    <div class="podium-posisi podium-posisi-1">
                        <div class="podium-avatar">${(p1.atasNama.charAt(0)).toUpperCase()}</div>
                        <div class="podium-nama">${p1.atasNama}</div>
                        <div class="podium-persen ${kelasWarna(p1.saldoPokok, p1.keuntungan)}">${hitungPersentase(p1.saldoPokok, p1.keuntungan)}</div>
                        <div class="podium-nilai">$ ${p1.totalSaldo.toFixed(2)}</div>
                        <div class="podium-papan">1</div>
                    </div>`;
                }
                if (daftarSemua.length >= 3) {
                    const p3 = daftarSemua[2];
                    podiumHtml += `
                    <div class="podium-posisi podium-posisi-3">
                        <div class="podium-avatar">${(p3.atasNama.charAt(0)).toUpperCase()}</div>
                        <div class="podium-nama">${p3.atasNama}</div>
                        <div class="podium-persen ${kelasWarna(p3.saldoPokok, p3.keuntungan)}">${hitungPersentase(p3.saldoPokok, p3.keuntungan)}</div>
                        <div class="podium-nilai">$ ${p3.totalSaldo.toFixed(2)}</div>
                        <div class="podium-papan">3</div>
                    </div>`;
                }
                wadahPodium.innerHTML = podiumHtml || `<div class="tidak-ada">Belum cukup peserta.</div>`;

                // === DAFTAR NOMOR 4 KE BAWAH ===
                let daftarHtml = "";
                for (let i = 3; i < daftarSemua.length; i++) {
                    const user = daftarSemua[i];
                    const rank = i + 1;
                    const kelasSaya = user.uid === uidSaatIni ? "saya" : "";
                    daftarHtml += `
                    <div class="baris-pengguna ${kelasSaya}">
                        <div class="nomor-urutan">${rank}</div>
                        <div class="info-pengguna">
                            <div class="nama-ktp">${user.atasNama} ${user.uid === uidSaatIni ? '(Anda)' : ''}</div>
                            <div class="persentase-baris ${kelasWarna(user.saldoPokok, user.keuntungan)}">
                                ${hitungPersentase(user.saldoPokok, user.keuntungan)}
                            </div>
                        </div>
                        <div class="saldo-pengguna">
                            <div class="nilai-saldo">$ ${user.totalSaldo.toFixed(2)}</div>
                            <div class="label-saldo">Total Saldo</div>
                        </div>
                    </div>`;
                }
                wadahDaftar.innerHTML = daftarHtml || `<div class="tidak-ada">Hanya 3 peserta teratas yang tampil di atas.</div>`;

            } catch (err) {
                console.error("Gagal memuat:", err);
                wadahPodium.innerHTML = `<div class="tidak-ada">Gagal: ${err.message}</div>`;
                wadahDaftar.innerHTML = "";
            }
        }
    </script>
</body>
</html>
