<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERINGKAT — CLOVERA UNION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        body {
            background: linear-gradient(135deg, #0A0F1C, #121A2E);
            min-height:100vh;
            padding:12px; position:relative;
        }
        body::before {
            content:""; position:fixed; inset:0;
            background:rgba(10,15,28,0.4); z-index:-1;
        }

        .tombol-kembali {
            position:fixed; top:12px; left:12px; z-index:100;
            width:42px; height:42px; border-radius:50%;
            background:linear-gradient(135deg, #1E3A5F, #2C5282);
            border:none; color:#fff; font-size:18px; font-weight:bold;
            cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.5);
            transition:transform 0.2s;
        }
        .tombol-kembali:active {transform:scale(0.92);}

        .container {max-width:420px; margin:60px auto 20px;}

        .header {
            text-align:center; margin-bottom:20px;
        }
        .header h1 {
            font-size:22px; font-weight:800; color:#FFD700;
            margin-bottom:4px;
        }
        .header p {font-size:13px; color:#AAA;}

        .kartu-peringkat {
            background:linear-gradient(135deg, #1E293B, #27374D);
            border-radius:12px; padding:14px; margin-bottom:10px;
            box-shadow:0 3px 10px rgba(0,0,0,0.3);
        }
        .judul-daftar {
            font-size:14px; font-weight:700; color:#FFD700;
            margin-bottom:12px; padding-bottom:8px;
            border-bottom:1px solid #334155;
            display:flex; justify-content:space-between; align-items:center;
        }
        .jumlah-user {font-size:12px; color:#AAA; font-weight:500;}

        .baris-pengguna {
            display:flex; align-items:center; gap:12px; padding:12px 10px;
            border-radius:10px; margin-bottom:8px;
            background:rgba(15,22,36,0.6);
            transition:all 0.2s;
        }
        .baris-pengguna:hover {background:rgba(30,41,59,0.8);}

        .nomor-urutan {
            width:36px; height:36px; border-radius:50%;
            background:#334155; color:#FFF;
            display:flex; align-items:center; justify-content:center;
            font-weight:700; font-size:16px; flex-shrink:0;
        }
        .nomor-urutan.piala {background:linear-gradient(135deg, #FFD700, #B8860B); color:#000; font-size:18px;}
        .nomor-urutan.bintang {background:linear-gradient(135deg, #FFC107, #FF9800); color:#000; font-size:16px;}

        .info-pengguna {flex:1; min-width:0;}
        .nama-ktp {
            font-size:14px; font-weight:600; color:#FFF;
            margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
        }
        .gmail-akun {font-size:11px; color:#888; margin-bottom:2px;}
        .instrumen-aktif {font-size:11px; color:#4ADE80;}

        .saldo-pengguna {text-align:right;}
        .nilai-saldo {
            font-size:15px; font-weight:700; color:#FFD700;
            margin-bottom:2px;
        }
        .label-saldo {font-size:10px; color:#666; text-transform:uppercase;}

        .loading {
            text-align:center; padding:60px 20px;
            color:#FFD700; font-size:15px; font-weight:500;
        }
        .tidak-ada {
            text-align:center; padding:40px 20px;
            color:#888; font-size:14px;
        }
        .saya {
            border:1px solid #FFD700; background:rgba(255,215,0,0.08);
        }
    </style>
</head>
<body>

    <button class="tombol-kembali" onclick="window.location.href='dasbor.html'">←</button>

    <div class="container">
        <div class="header">
            <h1>PERINGKAT ANGGOTA</h1>
            <p>Diurutkan berdasarkan yang tertinggi</p>
        </div>

        <div class="kartu-peringkat">
            <div class="judul-daftar">
                <span>DAFTAR ANGGOTA</span>
                <span class="jumlah-user" id="jumlahUser">0 Anggota</span>
            </div>
            <div id="daftarPeringkat">
                <div class="loading">Memuat data...</div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        let uidSaatIni = null;

        auth.onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "Login.html";
                return;
            }
            uidSaatIni = user.uid;
            muatPeringkat();
        });

        async function muatPeringkat() {
            const wadah = document.getElementById("daftarPeringkat");
            const jumlahEl = document.getElementById("jumlahUser");

            try {
                const snap = await db.collection("pengguna")
                    .limit(200)
                    .get();

                if (snap.empty) {
                    wadah.innerHTML = `<div class="tidak-ada">Belum ada data anggota.</div>`;
                    jumlahEl.textContent = "0 Anggota";
                    return;
                }

                const daftar = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    const saldoPokok = data.saldo || 0;
                    const keuntungan = data.keuntungan || 0;
                    const totalSaldo = saldoPokok + keuntungan;
                    
                    // Data dari field yang benar
                    const atasNama = data.atasNama || "Tidak ada nama";
                    const gmail = data.email || "";
                    const instrumenAktif = data.instrumenAktif || data.instrumen || "Tidak ada";

                    daftar.push({
                        uid: doc.id,
                        atasNama: atasNama,
                        gmail: gmail,
                        instrumenAktif: instrumenAktif,
                        totalSaldo: totalSaldo
                    });
                });

                // Urutkan dari saldo terbesar ke terkecil
                daftar.sort((a, b) => b.totalSaldo - a.totalSaldo);

                jumlahEl.textContent = `${daftar.length} Anggota`;

                let html = "";
                daftar.forEach((user, index) => {
                    const rank = index + 1;
                    
                    // 🥇 1-3 = Piala | ⭐ 4-6 = Bintang | Lainnya = angka
                    let ikonUrutan = rank;
                    let kelasIkon = "";
                    if (rank <= 3) {
                        ikonUrutan = "🏆";
                        kelasIkon = "piala";
                    } else if (rank <= 6) {
                        ikonUrutan = "⭐";
                        kelasIkon = "bintang";
                    }

                    const kelasSaya = user.uid === uidSaatIni ? "saya" : "";

                    html += `
                        <div class="baris-pengguna ${kelasSaya}">
                            <div class="nomor-urutan ${kelasIkon}">${ikonUrutan}</div>
                            <div class="info-pengguna">
                                <div class="nama-ktp">${user.atasNama} ${user.uid === uidSaatIni ? '(Anda)' : ''}</div>
                                <div class="gmail-akun">${user.gmail}</div>
                                <div class="instrumen-aktif"> Instrumen: ${user.instrumenAktif}</div>
                            </div>
                            <div class="saldo-pengguna">
                                <div class="nilai-saldo">$ ${user.totalSaldo.toFixed(2)}</div>
                                <div class="label-saldo">Total Saldo</div>
                            </div>
                        </div>
                    `;
                });

                wadah.innerHTML = html;

            } catch (err) {
                console.error("Gagal memuat peringkat:", err);
                wadah.innerHTML = `<div class="tidak-ada">Gagal memuat data: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
