<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRADING INSTRUMEN — CLOVERA UNION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
        
        /* === DIUBAH: BISA DI SCROLL === */
        html,body {height:100%; overflow:auto;}

        body {
            background: #121212;
            min-height:100vh; color:#E5E7EB;
        }
        .container {width:100%; min-height:100vh; display:flex; flex-direction:column;}

        /* === ATAS: HARGA & INSTRUMEN === */
        .bar-atas {
            padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
            flex-shrink:0;
        }
        .harga-pusat {
            font-size:22px; font-weight:700; color:#fff;
            background:#1E1E1E; padding:6px 20px; border-radius:20px;
        }
        .instrumen-pilih {
            display:flex; align-items:center; gap:6px; cursor:pointer;
        }
        .logo-instrumen {width:28px; height:28px; border-radius:50%; object-fit:contain;}
        .nama-instrumen {font-size:16px; font-weight:700; color:#fff;}
        .panah {color:#9CA3AF; font-size:10px;}

        /* === DAFTAR PILIHAN INSTRUMEN === */
        .daftar-pilihan {
            position:absolute; top:60px; left:16px; right:16px;
            background:#1E1E1E; border-radius:12px; z-index:100; display:none;
            box-shadow:0 4px 20px rgba(0,0,0,0.5);
        }
        .pilihan-item {
            display:flex; align-items:center; gap:10px; padding:14px 18px;
            cursor:pointer; transition:background 0.2s;
        }
        .pilihan-item:hover {background:#2A2A2A;}
        .pilihan-item:first-child {border-radius:12px 12px 0 0;}
        .pilihan-item:last-child {border-radius:0 0 12px 12px;}
        .pilihan-logo {width:26px; height:26px; border-radius:50%; object-fit:contain;}
        .pilihan-nama {font-size:15px; font-weight:600; color:#fff;}
        .pilihan-kode {font-size:12px; color:#9CA3AF; margin-left:auto;}

        /* === KOTAK PENDING === */
        .kotak-pending {
            margin:0 16px 8px; padding:8px 14px; background:rgba(251,146,60,0.15);
            border-radius:8px; display:none; font-size:13px; color:#FCD34D;
            flex-shrink:0;
        }

        /* === GRAFIK — BISA MENYESUAIKAN TINGGI === */
        .grafik-besar-box {
            flex:1; padding:0 8px; min-height:400px;
        }
        .info-atas-grafik {
            display:flex; justify-content:space-between; align-items:center; padding:0 10px 8px;
        }
        .perubahan-grafik {
            font-size:14px; font-weight:700; padding:4px 12px; border-radius:20px;
        }
        .naik {background:rgba(34,197,94,0.15); color:#4ADE80;}
        .turun {background:rgba(239,68,68,0.15); color:#F87171;}
        .candlestick-container {width:100%; height:500px;}
        .pesan-grafik {text-align:center; padding:60px 20px; color:#6B7280;}

        /* === TOMBOL DI BAWAH — TETAP TAMPAIL PENUH === */
        .tombol-baris {
            display:flex; gap:10px; padding:12px 16px 16px;
            flex-shrink:0;
        }
        .tombol-beli {
            flex:1; background:#2563EB; color:#fff; border:none; padding:14px;
            border-radius:8px; font-size:16px; font-weight:700; cursor:pointer;
        }
        .tombol-jual {
            flex:1; background:#EF4444; color:#fff; border:none; padding:14px;
            border-radius:8px; font-size:16px; font-weight:700; cursor:pointer;
        }
        .tombol:disabled {opacity:0.5; cursor:not-allowed;}

        .pesan {margin:0 16px 10px; padding:10px 14px; border-radius:8px; display:none; font-size:13px; flex-shrink:0;}
        .info {background:rgba(59,130,246,0.15); color:#93C5FD;}
        .sukses {background:rgba(16,185,129,0.15); color:#6EE7B7;}
        .error {background:rgba(239,68,68,0.15); color:#FCA5A5;}

        .loading {text-align:center; padding:80px 20px; color:#9CA3AF;}
        .bagian-login {text-align:center; padding:80px 20px;}
        .bagian-login h3 {color:#FBBF24; margin-bottom:20px;}
        .tombol-masuk {
            background:linear-gradient(180deg, #3B82F6, #2563EB);
            color:#fff; border:none; padding:14px 28px; border-radius:10px;
            font-size:16px; font-weight:700; cursor:pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="bagianLogin" class="bagian-login" style="display:none;">
            <h3>Silakan Login Dulu</h3>
            <button class="tombol-masuk" onclick="window.location.href='Login.html'">MASUK KE AKUN</button>
        </div>

        <div id="bagianData" style="display:none;">
            <!-- Bar Atas: Nama Instrumen & Harga Pusat -->
            <div class="bar-atas">
                <div class="instrumen-pilih" onclick="toggleDaftar()">
                    <img id="logoTerpilih" src="loginwall/xau.png" class="logo-instrumen" alt="">
                    <span class="nama-instrumen" id="namaTerpilih">XAU/USD</span>
                    <span class="panah">▼</span>
                </div>
                <div class="harga-pusat" id="hargaGrafik">—</div>
                <div></div>
            </div>

            <!-- Daftar Pilihan Instrumen -->
            <div class="daftar-pilihan" id="daftarPilihan">
                <div class="pilihan-item" onclick="pilihInstrumen('managerXauusd', 'XAU/USD', 'XAU', 'loginwall/xau.png')">
                    <img src="loginwall/xau.png" class="pilihan-logo" alt="XAU">
                    <span class="pilihan-nama">XAU/USD</span>
                    <span class="pilihan-kode">Emas</span>
                </div>
                <div class="pilihan-item" onclick="pilihInstrumen('managerBtcusd', 'BTC/USD', 'BTC', 'loginwall/btc.png')">
                    <img src="loginwall/btc.png" class="pilihan-logo" alt="BTC">
                    <span class="pilihan-nama">BTC/USD</span>
                    <span class="pilihan-kode">Bitcoin</span>
                </div>
                <div class="pilihan-item" onclick="pilihInstrumen('managerAudusd', 'AUD/USD', 'AUD', 'loginwall/aud.png')">
                    <img src="loginwall/aud.png" class="pilihan-logo" alt="AUD">
                    <span class="pilihan-nama">AUD/USD</span>
                    <span class="pilihan-kode">Dolar AUD</span>
                </div>
                <div class="pilihan-item" onclick="pilihInstrumen('tradingData', 'CLVC01', 'TRD', 'loginwall/td.png')">
                    <img src="loginwall/td.png" class="pilihan-logo" alt="TRD">
                    <span class="pilihan-nama">CLVC01</span>
                    <span class="pilihan-kode">Indeks</span>
                </div>
            </div>

            <!-- Kotak Pending -->
            <div id="kotakPending" class="kotak-pending">
                Menunggu persetujuan: <strong id="namaPermintaan"></strong>
            </div>

            <!-- Grafik -->
            <div class="grafik-besar-box">
                <div class="info-atas-grafik">
                    <div></div>
                    <div class="perubahan-grafik" id="perubahanGrafik">—</div>
                </div>
                <div class="candlestick-container" id="candlestickGrafik"></div>
            </div>

            <!-- Tombol Beli Jual — TETAP DI BAWAH & BISA DIAKSES -->
            <div class="tombol-baris">
                <button class="tombol-jual" id="tombolJual" onclick="jualInstrumen()">JUAL</button>
                <button class="tombol-beli" id="tombolBeli" onclick="beliInstrumen()">BELI</button>
            </div>
            <div id="pesanTindakan" class="pesan"></div>
        </div>

        <div id="loading" class="loading">Memverifikasi akun...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userSekarang = null;
        let uidPengguna = null;
        let emailPengguna = null;
        let instrumenTerpilih = 'managerXauusd';
        let namaInstrumenTerpilih = 'XAU/USD';
        let kodeTerpilih = 'XAU';
        let grafikCandle = null;
        let instrumenLamaPengguna = null;
        let namaInstrumenLamaPengguna = null;

        function formatUang(nilai) {
            return (nilai >= 0 ? "" : "") + "$" + nilai.toFixed(2);
        }

        function hitungPersentase(sebelum, sesudah) {
            const dasar = Math.abs(sebelum);
            if (dasar === 0) return 0;
            return ((sesudah - sebelum) / dasar) * 100;
        }

        function toggleDaftar() {
            const el = document.getElementById('daftarPilihan');
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        async function pilihInstrumen(id, nama, kode, logo) {
            instrumenTerpilih = id;
            namaInstrumenTerpilih = nama;
            kodeTerpilih = kode;

            document.getElementById('logoTerpilih').src = logo;
            document.getElementById('namaTerpilih').textContent = nama;
            document.getElementById('daftarPilihan').style.display = 'none';

            await muatGrafikLilin(id);
        }

        auth.onAuthStateChanged(async user => {
            document.getElementById("loading").style.display = "none";
            if (user) {
                userSekarang = user;
                uidPengguna = user.uid;
                emailPengguna = user.email;
                document.getElementById("bagianData").style.display = "block";
                await muatDataPengguna();
                pantauPermintaanPending();
                await muatGrafikLilin(instrumenTerpilih);
            } else {
                document.getElementById("bagianLogin").style.display = "block";
            }
        });

        async function muatDataPengguna() {
            try {
                const snap = await db.doc("pengguna/" + uidPengguna).get();
                if (snap.exists) {
                    const data = snap.data();
                    instrumenLamaPengguna = data.instrumenAktif || null;
                    namaInstrumenLamaPengguna = data.instrumenAktifNama || "Belum Ada";
                }
            } catch (err) {
                console.log("Belum ada data:", err.message);
            }
        }

        function pantauPermintaanPending() {
            if (!uidPengguna) return;
            db.collection("permintaanInstrumen").doc(uidPengguna).onSnapshot(snap => {
                if (snap.exists && snap.data().status === "PENDING") {
                    document.getElementById("kotakPending").style.display = "block";
                    document.getElementById("namaPermintaan").textContent = snap.data().instrumenBaruNama;
                } else {
                    document.getElementById("kotakPending").style.display = "none";
                }
            });
        }

        async function muatGrafikLilin(idDokumen) {
            const container = document.getElementById('candlestickGrafik');
            
            try {
                const snap = await db.collection(idDokumen).orderBy("timestamp", "asc").limit(40).get();

                if (snap.empty) {
                    container.innerHTML = `<div class="pesan-grafik">Belum ada data untuk ${namaInstrumenTerpilih}</div>`;
                    document.getElementById('hargaGrafik').textContent = '—';
                    document.getElementById('perubahanGrafik').textContent = '—';
                    document.getElementById('perubahanGrafik').className = 'perubahan-grafik';
                    if (grafikCandle) grafikCandle.destroy();
                    return;
                }

                let saldoAkumulasi = 0;
                let saldoSebelumnya = 0;
                let dataLilin = [];
                let semuaNilai = [];

                snap.docs.forEach(doc => {
                    const d = doc.data();
                    const pl = Number(d.pl) || 0;
                    
                    const buka = saldoSebelumnya;
                    saldoAkumulasi += pl;
                    const tutup = saldoAkumulasi;
                    
                    const rentang = Math.abs(pl) * 0.5;
                    const tinggi = Math.max(buka, tutup) + rentang;
                    const rendah = Math.min(buka, tutup) - rentang;

                    let waktu = d.label || d.periode || d.namaBulan;
                    if (!waktu && d.timestamp) {
                        waktu = new Date(d.timestamp.toDate()).toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit'});
                    }
                    if (!waktu) waktu = '-';

                    dataLilin.push({ x: waktu, y: [buka, tinggi, rendah, tutup] });
                    semuaNilai.push(tutup);
                    saldoSebelumnya = saldoAkumulasi;
                });

                const nilaiSekarang = semuaNilai[semuaNilai.length - 1];
                const nilaiSebelum = semuaNilai.length >= 2 ? semuaNilai[semuaNilai.length - 2] : 0;
                const selisih = nilaiSekarang - nilaiSebelum;
                const persen = hitungPersentase(nilaiSebelum, nilaiSekarang);

                document.getElementById('hargaGrafik').textContent = formatUang(nilaiSekarang);
                const elUbah = document.getElementById('perubahanGrafik');
                
                if (selisih > 0) {
                    elUbah.textContent = "+" + persen.toFixed(2) + "%";
                    elUbah.className = "perubahan-grafik naik";
                } else if (selisih < 0) {
                    elUbah.textContent = persen.toFixed(2) + "%";
                    elUbah.className = "perubahan-grafik turun";
                } else {
                    elUbah.textContent = "0.00%";
                    elUbah.className = "perubahan-grafik";
                }

                if (grafikCandle) grafikCandle.destroy();

                const opsi = {
                    chart: {
                        type: 'candlestick',
                        height: '100%',
                        foreColor: '#717171',
                        background: 'transparent',
                        toolbar: { show: false },
                        animations: { enabled: false }
                    },
                    series: [{ name: kodeTerpilih, data: dataLilin }],
                    xaxis: {
                        type: 'category',
                        labels: { style: { colors: '#555', fontSize: '10px' } },
                        axisBorder: { color: '#2A2A2A' },
                        tickPlacement: 'between'
                    },
                    yaxis: {
                        opposite: true,
                        labels: {
                            style: { colors: '#555', fontSize: '10px' },
                            formatter: val => val.toFixed(2)
                        },
                        axisBorder: { color: '#2A2A2A' }
                    },
                    grid: {
                        borderColor: '#2A2A2A',
                        strokeDashArray: 0,
                        xaxis: { lines: { show: true } },
                        yaxis: { lines: { show: true } }
                    },
                    plotOptions: {
                        candlestick: {
                            colors: { upward: '#2563EB', downward: '#EF4444' },
                            wick: { useFillColor: true },
                            barWidth: '65%'
                        }
                    },
                    tooltip: {
                        theme: 'dark',
                        background: '#1E1E1E',
                        borderColor: '#333',
                        style: { fontSize: '12px' },
                        y: {
                            formatter: val => `Buka: $${val[0].toFixed(2)} | Tinggi: $${val[1].toFixed(2)} | Rendah: $${val[2].toFixed(2)} | Tutup: $${val[3].toFixed(2)}`
                        }
                    }
                };

                grafikCandle = new ApexCharts(container, opsi);
                await grafikCandle.render();

            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `<div class="pesan-grafik">Error: ${err.message}</div>`;
            }
        }

        async function beliInstrumen() {
            if(!instrumenTerpilih) { alert("Pilih instrumen dulu!"); return; }
            if(instrumenTerpilih === instrumenLamaPengguna) {
                tampilPesan("Sudah aktif di instrumen ini!", "info");
                return;
            }

            if(!confirm(`Transfer dana:\n\nDari: ${namaInstrumenLamaPengguna}\nKe: ${namaInstrumenTerpilih}\n\nLanjutkan beli?`)) return;

            try {
                await db.collection("permintaanInstrumen").doc(uidPengguna).set({
                    uidPengguna, emailPengguna,
                    namaPengguna: userSekarang.displayName || "Pengguna",
                    jenisTindakan: "BELI",
                    instrumenLama: instrumenLamaPengguna,
                    instrumenLamaNama: namaInstrumenLamaPengguna,
                    instrumenBaru: instrumenTerpilih,
                    instrumenBaruNama: namaInstrumenTerpilih,
                    status: "PENDING",
                    waktuDiajukan: firebase.firestore.FieldValue.serverTimestamp()
                });
                tampilPesan("✅ Permintaan BELI dikirim! Tunggu Admin.", "sukses");
            } catch (err) {
                tampilPesan(err.code === "permission-denied" 
                    ? "Masih ada permintaan yang belum diproses!" 
                    : "Gagal: " + err.message, "error");
            }
        }

        async function jualInstrumen() {
            if(!instrumenLamaPengguna) {
                tampilPesan("Belum ada instrumen yang aktif!", "info");
                return;
            }

            if(!confirm(`Dana masih terhubung :\n\n${namaInstrumenLamaPengguna}\n\nTetap jual?`)) return;

            try {
                await db.collection("permintaanInstrumen").doc(uidPengguna).set({
                    uidPengguna, emailPengguna,
                    namaPengguna: userSekarang.displayName || "Pengguna",
                    jenisTindakan: "JUAL",
                    instrumenLama: instrumenLamaPengguna,
                    instrumenLamaNama: namaInstrumenLamaPengguna,
                    instrumenBaru: null,
                    instrumenBaruNama: "Tidak Aktif",
                    status: "PENDING",
                    waktuDiajukan: firebase.firestore.FieldValue.serverTimestamp()
                });
                tampilPesan("❌ Permintaan JUAL dikirim! Tunggu Admin.", "sukses");
            } catch (err) {
                tampilPesan(err.code === "permission-denied" 
                    ? "Masih ada permintaan yang belum diproses!" 
                    : "Gagal: " + err.message, "error");
            }
        }

        function tampilPesan(teks, jenis) {
            const el = document.getElementById('pesanTindakan');
            el.className = `pesan ${jenis}`;
            el.textContent = teks;
            el.style.display = "block";
            setTimeout(() => el.style.display = "none", 6000);
        }
    </script>
</body>
</html>
