<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinyal Trading — CLOVERA UNION</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif;}
        
        /* ===== WARNA UTAMA ===== */
        :root {
            --latar-gelap: #0F172A;
            --kartu-biru: #1E293B;
            --tombol-aktif: #1E40AF;   /* Biru untuk Aktif */
            --tombol-running: #F59E0B;  /* Kuning untuk Running */
            --kartu-biru-terang: #27374D;
            --batas-biru: #334155;
            --hijau: #10B981;
            --merah: #EF4444;
            --kuning-emas: #FBBF24;
            --putih: #F8FAFC;
            --abu-lembut: #94A3B8;
        }

        body {background: var(--latar-gelap); min-height:100vh; color: var(--putih);}

        /* ===== HEADER & TAB ===== */
        .atas {background: var(--kartu-biru); padding:16px; border-bottom:1px solid var(--batas-biru);}
        .judul {font-size:20px; font-weight:700; color: var(--kuning-emas); text-align:center; margin-bottom:16px;}
        
        .tab-container {display:flex; gap:8px; margin-bottom:12px;}
        .tab {flex:1; text-align:center; padding:10px 8px; font-size:14px; font-weight:600; color: var(--abu-lembut); border-bottom:2px solid transparent; cursor:pointer;}
        .tab.aktif {color: var(--hijau); border-bottom-color: var(--hijau);}

        .filter-bar {padding:0 16px 12px; background: var(--kartu-biru);}
        .filter-btn {width:100%; padding:10px 14px; background: var(--hijau); color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; text-align:left; display:flex; justify-content:space-between; align-items:center;}
        .filter-btn::after {content:"▼"; font-size:12px; opacity:.8;}

        /* ===== KONTEN ===== */
        .konten {padding:16px;}
        .kosong {text-align:center; padding:60px 20px; color: var(--abu-lembut);}
        .kosong p {font-size:14px; margin-top:4px; margin-bottom:20px;}

        /* === KARTU SINYAL — TETAP BIASA === */
        .kartu {background: var(--kartu-biru); border-radius:12px; border:1px solid var(--batas-biru); padding:16px; margin-bottom:12px;}
        .baris-atas {display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
        .pair {font-size:22px; font-weight:800; color: var(--kuning-emas);}
        .id-sinyal {font-size:13px; color: var(--abu-lembut);}
        
        .info-baris {display:flex; justify-content:space-between; padding:6px 0; font-size:14px;}
        .label {color: var(--abu-lembut);}
        .nilai {font-weight:700; color: var(--putih);}
        .pips-untung {color: var(--hijau); font-weight:bold; font-size:16px;}
        .pips-rugi {color: var(--merah); font-weight:bold; font-size:16px;}
        
        .kotak-data {background: var(--kartu-biru-terang); border-radius:8px; padding:12px; margin:10px 0;}
        .kotak-data .baris {display:flex; justify-content:space-between; padding:6px 0; font-size:15px;}
        .kotak-data .label {color: #CBD5E1;}
        .kotak-data .nilai {font-weight:700; color: var(--putih);}

        /* === TOMBOL STATUS — HANYA INI YANG BERWARNA === */
        .status-papan {padding:10px; border-radius:8px; font-weight:700; text-align:center; margin-top:10px; font-size:16px;}
        .papan-aktif {background: var(--tombol-aktif); color:#fff;}
        .papan-running {background: var(--tombol-running); color:#111;}

        .status-badge {padding:8px 12px; border-radius:8px; font-weight:700; text-align:center; margin:10px 0; width:100%; font-size:16px;}
        .expired {background: #475569; color: #E2E8F0;}
        .profit {background: var(--hijau); color:#fff;}
        .loss {background: var(--merah); color:#fff;}

        .waktu-kecil {font-size:13px; color: var(--abu-lembut); margin-top:4px;}

        /* === GRAFIK === */
        .wadah-grafik {background: var(--kartu-biru); border-radius:12px; padding:16px; margin-bottom:12px; border:1px solid var(--batas-biru);}
        .judul-grafik {font-size:15px; font-weight:700; color: var(--putih); margin-bottom:12px;}
    </style>
</head>
<body>

    <div class="atas">
        <div class="judul">CLOVERA UNION</div>
        <div class="tab-container">
            <div class="tab" id="tabStat" onclick="gantiTab('statistik')">Statistik</div>
            <div class="tab aktif" id="tabAktif" onclick="gantiTab('aktif')">Active Signal</div>
            <div class="tab" id="tabRiwayat" onclick="gantiTab('riwayat')">History Signal</div>
        </div>
    </div>

    <div class="filter-bar" id="filterAktif">
        <button class="filter-btn">Filter Active Signal</button>
    </div>
    <div class="filter-bar" id="filterRiwayat" style="display:none;">
        <button class="filter-btn">Filter History Signal</button>
    </div>

    <div class="konten" id="kontenStat" style="display:none;">
        <div class="wadah-grafik">
            <div class="judul-grafik">Performa Sinyal</div>
            <div id="grafik"></div>
        </div>
        <div class="wadah-grafik">
            <div class="judul-grafik">Ringkasan</div>
            <div class="info-baris"><span class="label">Total Sinyal</span><span class="nilai" id="jmlTotal">0</span></div>
            <div class="info-baris"><span class="label">Profit</span><span class="nilai pips-untung" id="jmlProfit">0</span></div>
            <div class="info-baris"><span class="label">Loss</span><span class="nilai pips-rugi" id="jmlLoss">0</span></div>
            <div class="info-baris"><span class="label">Expired</span><span class="nilai" id="jmlExpired">0</span></div>
            <div class="info-baris"><span class="label">Total Pips Bersih</span><span class="nilai" id="totalPips">0 Pips</span></div>
        </div>
    </div>

    <div class="konten" id="kontenAktif">
        <div id="daftarAktif"></div>
    </div>

    <div class="konten" id="kontenRiwayat" style="display:none;">
        <div id="daftarRiwayat"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuWAjpoztwQtCnrHyV18kRA5AaDFcsyGo",
            authDomain: "jurnal-trade-pro.firebaseapp.com",
            projectId: "jurnal-trade-pro"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let tabSekarang = "aktif";
        let grafik = null;
        let semuaData = [];

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "Login.html"; return; }
            muatSemuaData();
        });

        function gantiTab(nama) {
            tabSekarang = nama;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('aktif'));
            document.getElementById('tabStat').classList.toggle('aktif', nama==='statistik');
            document.getElementById('tabAktif').classList.toggle('aktif', nama==='aktif');
            document.getElementById('tabRiwayat').classList.toggle('aktif', nama==='riwayat');

            document.getElementById('kontenStat').style.display = nama==='statistik' ? 'block' : 'none';
            document.getElementById('kontenAktif').style.display = nama==='aktif' ? 'block' : 'none';
            document.getElementById('kontenRiwayat').style.display = nama==='riwayat' ? 'block' : 'none';
            document.getElementById('filterAktif').style.display = nama==='aktif' ? 'block' : 'none';
            document.getElementById('filterRiwayat').style.display = nama==='riwayat' ? 'block' : 'none';

            if (nama==='statistik') gambarGrafik();
            tampilkanData();
        }

        async function muatSemuaData() {
            try {
                const snap = await db.collection("signal").orderBy("waktu", "desc").get();
                semuaData = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    semuaData.push({id:doc.id, ...d});
                });
                tampilkanData();
                siapkanStatistik();
            } catch (err) {
                console.error(err);
            }
        }

        function tampilkanData() {
            const aktif = semuaData.filter(d => {
                const s = (d.status || "aktif").toLowerCase();
                return s === "aktif" || s === "running";
            });

            const riwayat = semuaData.filter(d => {
                const s = (d.status || "aktif").toLowerCase();
                const sudahSelesai = ["profit","loss","expired"].includes(s);
                const disembunyikan = d.disembunyikan === true;
                return sudahSelesai && !disembunyikan;
            });

            let htmlAktif = "";
            if (aktif.length === 0) {
                htmlAktif = `<div class="kosong"><p>Tidak ada sinyal aktif</p></div>`;
            } else {
                aktif.forEach(d => htmlAktif += buatKartu(d, false));
            }
            document.getElementById("daftarAktif").innerHTML = htmlAktif;

            let htmlRiwayat = "";
            if (riwayat.length === 0) {
                htmlRiwayat = `<div class="kosong"><p>Belum ada riwayat sinyal</p></div>`;
            } else {
                riwayat.forEach(d => htmlRiwayat += buatKartu(d, true));
            }
            document.getElementById("daftarRiwayat").innerHTML = htmlRiwayat;
        }

        function buatKartu(d, sudahSelesai) {
            const pair = d.pair || "—";
            const jenis = (d.jenis || "BUY").toUpperCase();
            const harga = d.price || 0;
            const tp = d.tp || 0;
            const sl = d.sl || 0;
            
            const pipsUntung = d.pipsUntung || 0;
            const pipsRugi = d.pipsRugi || 0;
            
            const status = (d.status || "aktif").toLowerCase();
            const catatan = d.catatan || "-";
            
            const waktuBuat = d.waktu ? d.waktu.toDate().toLocaleString('id-ID') : "—";
            const waktuTutup = d.ditutupPada ? d.ditutupPada.toDate().toLocaleString('id-ID') : "—";

            let teksStatusPapan = "";
            let kelasPapan = "";
            let kelasStatus = "";
            let teksStatus = "";
            
            if (!sudahSelesai) {
                if (status === "aktif") {
                    teksStatusPapan = "Aktif";
                    kelasPapan = "papan-aktif";
                } else if (status === "running") {
                    teksStatusPapan = "Running";
                    kelasPapan = "papan-running";
                }
            } else {
                if (status === "profit") {
                    kelasStatus = "profit";
                    teksStatus = `+${pipsUntung} Pips`;
                } else if (status === "loss") {
                    kelasStatus = "loss";
                    teksStatus = `-${pipsRugi} Pips`;
                } else if (status === "expired") {
                    kelasStatus = "expired";
                    teksStatus = "Expired";
                }
            }

            return `
            <div class="kartu">
                <div class="baris-atas">
                    <div class="pair">${pair}</div>
                    <div class="id-sinyal">Signal ID #${d.id.slice(-8)}</div>
                </div>
                <div class="info-baris">
                    <span class="label">No. Order</span>
                    <span class="nilai">${d.noOrder || Math.floor(Math.random()*9000000000+1000000000)}</span>
                </div>
                <div class="info-baris">
                    <span class="label">Created at</span>
                    <span class="nilai waktu-kecil">${waktuBuat}</span>
                </div>

                <div class="kotak-data">
                    <div class="baris"><span class="label">Type</span><span class="nilai">${jenis}</span></div>
                    <div class="baris"><span class="label">Price</span><span class="nilai">${harga}</span></div>
                    <div class="baris"><span class="label">Take Profit</span><span class="nilai">${tp}</span></div>
                    <div class="baris"><span class="label">Stop Loss</span><span class="nilai">${sl}</span></div>
                </div>

                <div class="info-baris">
                    <span class="label">Pips Untung</span>
                    <span class="nilai pips-untung">${pipsUntung}</span>
                </div>
                <div class="info-baris">
                    <span class="label">Pips Rugi</span>
                    <span class="nilai pips-rugi">${pipsRugi}</span>
                </div>

                <div class="info-baris">
                    <span class="label">Catatan</span>
                </div>
                <div class="kotak-data" style="padding:10px; margin-top:4px;">
                    <span style="color:#CBD5E1; font-size:14px;">${catatan}</span>
                </div>

                ${!sudahSelesai ? `
                <div class="status-papan ${kelasPapan}">
                    ${teksStatusPapan}
                </div>
                ` : `
                <div class="info-baris" style="margin-top:8px;">
                    <span class="label">Closed at</span>
                    <span class="nilai waktu-kecil">${waktuTutup}</span>
                </div>
                <div class="status-badge ${kelasStatus}">
                    ${teksStatus}
                </div>
                `}
            </div>`;
        }

        function siapkanStatistik() {
            const total = semuaData.length;
            const profitList = semuaData.filter(d => d.status==="profit");
            const lossList = semuaData.filter(d => d.status==="loss");
            const expired = semuaData.filter(d => d.status==="expired");
            
            const totalPipsUntung = profitList.reduce((sum,d) => sum + (parseFloat(d.pipsUntung)||0), 0);
            const totalPipsRugi = lossList.reduce((sum,d) => sum + (parseFloat(d.pipsRugi)||0), 0);
            const totalBersih = totalPipsUntung - totalPipsRugi;

            document.getElementById("jmlTotal").textContent = total;
            document.getElementById("jmlProfit").textContent = `${profitList.length} (+${totalPipsUntung})`;
            document.getElementById("jmlLoss").textContent = `${lossList.length} (-${totalPipsRugi})`;
            document.getElementById("jmlExpired").textContent = expired.length;
            
            const elemenTotal = document.getElementById("totalPips");
            elemenTotal.textContent = `${totalBersih >= 0 ? '+' : ''}${totalBersih} Pips`;
            elemenTotal.className = totalBersih >= 0 ? "nilai pips-untung" : "nilai pips-rugi";

            if (tabSekarang==='statistik') gambarGrafik();
        }

        function gambarGrafik() {
            if (grafik) grafik.destroy();
            const options = {
                chart: {type:'donut', height:260, background:'transparent'},
                labels: ['Profit','Loss','Expired'],
                colors: ['#10B981','#EF4444','#64748B'],
                series: [
                    semuaData.filter(d=>d.status==='profit').length,
                    semuaData.filter(d=>d.status==='loss').length,
                    semuaData.filter(d=>d.status==='expired').length
                ],
                legend: {position:'bottom', labels:{colors:'#CBD5E1'}},
                theme: {mode:'dark'}
            };
            grafik = new ApexCharts(document.querySelector("#grafik"), options);
            grafik.render();
        }
    </script>
</body>
</html>
